    statement: "the vowel-deletion set beyond Laws 6-7: (i) apocope (word-final short vowels, all PA short vowels); (ii) aphaeresis — unstressed ə (< PA *e), typically not *a, lost in absolute word-initial position; (iii) syncope: (a) word-initial syllables between a resonant and a fricative (resonants devoiced), (b) noninitial syllables between a resonant and a non-fricative consonant, (c) noninitial syllables before a consonant cluster beginning with a fricative, (d) noninitial syllables between any consonant and a following fricative. In initial syllables an obstruent before the vowel blocks the loss. None of the five processes is stress-conditioned"
    environment: "as stated per process (the record's taxonomy)"
    anchor: {path: "docs/research/sources/rudes1997 (parent record) §4.4", lines: ""}
    note: >-
