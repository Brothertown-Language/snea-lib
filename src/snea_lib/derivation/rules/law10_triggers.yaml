#   docs/research/sound-law-rule-inventory.yaml (law-psnea-k-palatalization)
# Costa operative: before PEA *ē and some instances of PA *i; the palatalized
# *k appears as a palatal stop [tʲ] in Massachusett and Coweset, but as a
# simple palatal in all other SNEA languages.
