table2_vowels:
  columns: [PA, PEA, PSNEA, Ms, Nr, Mp, WP, Law]
  notes:
    system: >-
      the PEA/PSNEA vowel notation carries the PEA system (two short vowels
      *ǝ, *a; four long *ī, *ō, *ē, *ā) — the daughter cells are the attested
      reflexes, whose own developments (e.g. shortened reflexes of PEA *ī) are
      per-language. The *a· row's nasalized reflexes are the intrusive-nasal
      development (Law 14); the *e· row carries the #107-adjudicated
      chain-shift account; the unstressed *e/*a row's deletion environments
      are stated in Law 16, not in the cells.
  rows:
    - {pa: "*a", pea: "*a", psnea: "*a", ms: "a", nr: "a", mp: "a", wp: "a", law: null}
    - {pa: "*e", pea: "*ǝ", psnea: "*ǝ", ms: "a", nr: "a", mp: "u", wp: "ə / a", law: "4"}
    - {pa: "*i, *i·", pea: "*ī", psnea: "*ī", ms: "i", nr: "i", mp: "i", wp: "i", law: "5"}
    - {pa: "*o, *o·", pea: "*ō", psnea: "*ō", ms: "õ", nr: "oo", mp: "o", wp: null, law: "5"}
    - {pa: "*a·", pea: "*ā", psnea: "*ā", ms: "ã·", nr: "ô", mp: "ô", wp: "ã·", law: "14"}
    - {pa: "*e·", pea: "*ē", psnea: "*ē", ms: "â", nr: "â", mp: "á", wp: "a·", law: "#107"}
    - {pa: "*e, *a (unstressed)", pea: "*ǝ, *a", psnea: null, ms: "ə", nr: null, mp: "Ø", wp: "Ø", law: "16"}

table3_word_final:
  columns: [Input, Change, Output, Law]
  note: "the š/s alternation in row 4 is the Law 13 gradient reduction (language-particular detail in Law 13, not in the cells)."
  rows:
    - {input: "word-final V", change: "apocope", output: "Ø", law: "6, 16"}
    - {input: "word-final *-kw", change: "retention", output: "-kw", law: "6"}
    - {input: "word-final *m, *n, *w, *y syllables", change: "loss", output: "Ø", law: "6"}
    - {input: "word-final PEA *r", change: "→ š / s", output: "š / s", law: "12, 13"}
    - {input: "disyllables", change: "final-V loss", output: "Ø", law: "6"}