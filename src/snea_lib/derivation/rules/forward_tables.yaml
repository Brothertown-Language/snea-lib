# Rule data of record: the forward correspondence tables (paper Tables 1-3).
#
# Extracted from the parent record (snea-phonetics):
#   docs/research/pa-pea-psnea-sound-continuum.tex §2 (Tables 1-3 with notes)
# Base tables: Fielding 2005's Sound Change Chart, as corrected by
# Dr. Keith Cunningham (the corrected reading carried, the superseded Fielding
# readings carried in the law data). Cells are filled only where a cited source
# attests the reflex; null marks unattested-in-sources (the tables' ---).
