# Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

meta:
  source: "docs/research/pa-pea-psnea-sound-continuum.tex §2 (parent record)"
  base: "Fielding 2005 pp. 26-27, as Cunningham-corrected (paper §2)"

table1_consonants:
  columns: [PA, PEA, PSNEA, Ms, Nr, Mp, WP, Law]
  notes:
    a: >-
      Base: the Mp column is Fielding's Sound Change Chart as corrected by
      Cunningham — her cp for *hp/*xp is superseded by hp (Law 19); her
      *nt/*nk row is superseded by t / k (Law 18); her Delaware t (d?) is
      resolved to t (p, t, k). All uncorrected Fielding rows stand as charted.
    b: >-
      The *š Mp cell reads sh as Fielding charted (uncorrected); the
      PA/PEA/PSNEA columns follow Costa's EA-wide merger (Law 9). The Ms/Nr s
      and WP s (insular) readings agree with Law 9.
    c: >-
      WP *θ/*l/*r: r in the mainland dialect, y in the insular dialect
      (Rudes 1997 Table 3).
    d: >-
      Ms hk / q for Law 20: ⟨q⟩ is the spelling before /w/
      (Goddard 1981 §15).
    e: "Law-column null = no numbered law states a change for that row (identity reflex)."
  rows:
    - {pa: "*p", pea: "*p", psnea: "*p", ms: "p", nr: "p", mp: "p", wp: "p", law: null}
    - {pa: "*t", pea: "*t", psnea: "*t", ms: "t", nr: "t", mp: "t", wp: "t", law: null}
