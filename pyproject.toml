[project]
name = "snea-lib"
version = "0.1.0"
description = "Shared Python machinery for SNEA/PA/PEA/PSNEA projects — derivation, composition, and orthography/IPA tooling"
requires-python = "~=3.12"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snea_lib"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"